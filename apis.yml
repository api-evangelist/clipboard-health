aid: clipboard-health
name: Clipboard Health
description: Clipboard Health (now branded simply "Clipboard", at clipboardworks.com) is a U.S. healthcare
  workforce marketplace that connects workplaces — long-term care facilities, home health and hospice
  agencies, hospitals, dental practices, and travel assignments — with vetted, independent professionals
  to fill open shifts. Workplaces post shifts and Clipboard matches, credentials, schedules, and pays
  qualified workers, with the platform handling documentation, compliance, and instant pay for pros. The
  company reports serving more than 6,500 workplaces and over a million workers nationwide. Backed by
  Initialized Capital and IVP, it was added to the API Evangelist network as a portfolio company. Clipboard
  Health publishes no public consumer API; its public developer surface is limited to open-source TypeScript
  utility libraries on npm (the @clipboard-health scope, from github.com/ClipboardHealth/core-utils) and
  a minimal RFC 9116 security.txt.
