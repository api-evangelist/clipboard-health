notes: >-
  These are Clipboard Health's first-party OPEN-SOURCE TypeScript utility
  libraries (all published from github.com/ClipboardHealth/core-utils). They are
  general-purpose developer utilities (JSON:API helpers, Zod contract schemas, a
  rules engine, testing + eslint config) — NOT client SDKs for a Clipboard Health
  consumer API. Clipboard Health publishes no public REST/GraphQL API, so no
  `SDKs` pointer is emitted (that would misrepresent these as API clients). Note:
  api-docs.clipboard.app belongs to a different company ("Clipboard", the K-12
  purchasing platform at clipboard.app) and is NOT this provider.
